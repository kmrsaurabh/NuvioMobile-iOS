name: Build NuvioPlus (iOS C++ libtorrent)

on:
  workflow_dispatch:
  push:
    branches:
      - 'nuvio-cpp'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libtorrent:
    name: Compile libtorrent for iOS arm64
    runs-on: macos-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute libtorrent cache key
        id: cache-key
        run: echo "key=libtorrent-ios-arm64-v2-$(date +%Y%m)" >> $GITHUB_OUTPUT

      - name: Restore cached libtorrent build
        id: cache-libtorrent
        uses: actions/cache@v4
        with:
          path: libtorrent-built
          key: ${{ steps.cache-key.outputs.key }}

      - name: Build libtorrent + Boost + OpenSSL from source (if not cached)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        run: |
          echo "Bootstrapping vcpkg..."
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh

          echo "Building libtorrent (and all dependencies) for iOS arm64..."
          ./vcpkg install libtorrent:arm64-ios

          echo "Copying compiled output..."
          mkdir -p ../libtorrent-built
          cp -R installed/arm64-ios/ ../libtorrent-built/

      - name: Upload compiled libtorrent
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-ios-arm64
          path: libtorrent-built/

  build-ios:
    name: Build NuvioPlus iOS App
    runs-on: macos-latest
    needs: build-libtorrent
    permissions:
      contents: write
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Git Checkout Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Auto-increment Patch Version
        run: |
          CURRENT_VERSION=$(awk -F'=' '/MARKETING_VERSION/ {print $2}' iosApp/Configuration/Version.xcconfig | tr -d ' ')
          IFS='.' read -ra ADDR <<< "$CURRENT_VERSION"
          NEW_VERSION="${ADDR[0]}.${ADDR[1]}.$((ADDR[2] + 1))"
          perl -pi -e "s/MARKETING_VERSION=.*/MARKETING_VERSION=$NEW_VERSION/" iosApp/Configuration/Version.xcconfig
          echo "Bumped version from $CURRENT_VERSION to $NEW_VERSION"

      - name: Set NuvioPlus App Identity (separate Bundle ID & Display Name)
        run: |
          # Change bundle ID so it installs as a separate app alongside Nuvio (Go)
          plutil -replace CFBundleIdentifier -string "com.nuvio.app.cpp" iosApp/iosApp/Info.plist
          plutil -replace CFBundleName       -string "NuvioPlus"            iosApp/iosApp/Info.plist
          plutil -replace CFBundleDisplayName -string "NuvioPlus"           iosApp/iosApp/Info.plist
          echo "Bundle ID and display name set to NuvioPlus"

      - name: Fetch iOS Specific Submodule (MPVKit)
        run: git submodule update --init --recursive MPVKit

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Konan (Kotlin Native Toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF

      # ── KEY DIFFERENCE: Download libtorrent artifact, skip Go entirely ──
      - name: Restore cached libtorrent build
        id: cache-libtorrent
        uses: actions/cache@v4
        with:
          path: libtorrent-built
          key: ${{ needs.build-libtorrent.outputs.cache-key }}

      - name: Download libtorrent artifact (if cache missed)
        if: steps.cache-libtorrent.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: libtorrent-ios-arm64
          path: libtorrent-built/

      - name: Stage libtorrent into Xcode project
        run: |
          mkdir -p iosApp/Frameworks/LibTorrent/lib
          mkdir -p iosApp/Frameworks/LibTorrent/include
          cp libtorrent-built/lib/libtorrent-rasterbar.a iosApp/Frameworks/LibTorrent/lib/
          cp -R libtorrent-built/include/* iosApp/Frameworks/LibTorrent/include/
          # Also copy Boost and OpenSSL static libs needed for linking, but exclude iconv/charset
          find libtorrent-built/lib -name "*.a" \
            ! -name "libtorrent-rasterbar.a" \
            ! -name "libiconv.a" \
            ! -name "libcharset.a" \
            -exec cp {} iosApp/Frameworks/LibTorrent/lib/ \;

          echo "Staged libraries:"
          ls -lh iosApp/Frameworks/LibTorrent/lib/

      - name: Generate Timestamp Build Version
        run: |
          BUMPED_VERSION=$(date -u +%y%m%d%H%M)
          echo "BUMPED_VERSION=${BUMPED_VERSION}" >> $GITHUB_ENV
          echo "Build version: ${BUMPED_VERSION}"

      - name: Inject C++ files and linker flags into Xcode Project
        run: |
          gem install xcodeproj
          cat << 'EOF' > patch_xcodeproj.rb
          require 'xcodeproj'
          project_path = 'iosApp/iosApp.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'iosApp' } || project.targets.first

          # 1. Add Source Files
          ios_group = project.main_group.children.find { |c| c.display_name == 'iosApp' || c.path == 'iosApp' }
          
          # Create TorrentEngine group
          torrent_group = ios_group.children.find { |c| c.display_name == 'TorrentEngine' || c.path == 'TorrentEngine' }
          if torrent_group.nil?
            torrent_group = ios_group.new_group('TorrentEngine', 'TorrentEngine')
          end
          
          # Create cpp group
          cpp_group = torrent_group.children.find { |c| c.display_name == 'cpp' || c.path == 'cpp' }
          if cpp_group.nil?
            cpp_group = torrent_group.new_group('cpp', 'cpp')
          end

          # Find or add files
          def add_to_target(group, filename, target)
            file_ref = group.children.find { |c| c.path == filename }
            file_ref ||= group.new_file(filename)
            unless target.source_build_phase.files_references.include?(file_ref)
              target.source_build_phase.add_file_reference(file_ref)
            end
          end

          add_to_target(cpp_group, 'LibtorrentBridge.mm', target)
          add_to_target(cpp_group, 'LibtorrentHTTPServer.swift', target)
          add_to_target(torrent_group, 'TorrentEngineSwiftBridge.swift', target)
          add_to_target(torrent_group, 'TorrentEngineRegistration.swift', target)

          # 2. Update Build Settings
          target.build_configurations.each do |config|
            # Header Search Paths
            hsp = config.build_settings['HEADER_SEARCH_PATHS'] || ['$(inherited)']
            hsp = [hsp] if hsp.is_a?(String)
            hsp << '$(SRCROOT)/Frameworks/LibTorrent/include'
            config.build_settings['HEADER_SEARCH_PATHS'] = hsp.uniq

            # Library Search Paths
            lsp = config.build_settings['LIBRARY_SEARCH_PATHS'] || ['$(inherited)']
            lsp = [lsp] if lsp.is_a?(String)
            lsp << '$(SRCROOT)/Frameworks/LibTorrent/lib'
            config.build_settings['LIBRARY_SEARCH_PATHS'] = lsp.uniq

            # Linker Flags
            ldflags = config.build_settings['OTHER_LDFLAGS'] || ['$(inherited)']
            ldflags = [ldflags] if ldflags.is_a?(String)
            ldflags.concat(['-lc++', '-ltorrent-rasterbar', '-lssl', '-lcrypto', '-lz', '-liconv'])
            Dir.glob('iosApp/Frameworks/LibTorrent/lib/libboost_*.a').each do |boost_lib|
              lib_name = File.basename(boost_lib, '.a').sub(/^lib/, '')
              ldflags << "-l#{lib_name}"
            end
            config.build_settings['OTHER_LDFLAGS'] = ldflags.uniq
            
            # Additional Flags
            config.build_settings['ENABLE_BITCODE'] = 'NO'
          end

          project.save
          puts 'Successfully updated Xcode project!'
          EOF
          ruby patch_xcodeproj.rb

      - name: Build NuvioPlus iOS App via Xcode
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="com.nuvio.app.cpp" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package, Release, and Update SideStore (NuvioPlus entry)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd iosApp/build/Build/Products/Release-iphoneos
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Nuvio.app/Info.plist)

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ env.BUMPED_VERSION }}" Nuvio.app/Info.plist

          rm -rf Payload
          mkdir -p Payload
          cp -R Nuvio.app Payload/
          IPA_NAME="NuvioPP-v${APP_VERSION}-${{ env.BUMPED_VERSION }}.ipa"
          zip -q -r "$IPA_NAME" Payload

          # Publish as a separate GitHub Release tagged with "cpp-" prefix
          gh release create "cpp-v${APP_VERSION}-${{ env.BUMPED_VERSION }}" "$IPA_NAME" \
            --title "NuvioPlus v${APP_VERSION} (Build ${{ env.BUMPED_VERSION }})" \
            --notes "NuvioPlus experimental build using native C++ libtorrent-rasterbar engine."

          IPA_SIZE=$(stat -f%z "$IPA_NAME")
          IPA_SHA256=$(shasum -a 256 "$IPA_NAME" | awk '{print $1}')
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/cpp-v${APP_VERSION}-${{ env.BUMPED_VERSION }}/$IPA_NAME"
          CURRENT_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Update apps.json — NuvioPlus is apps[1] (separate listing in SideStore)
          cd ${GITHUB_WORKSPACE}
          jq --arg version "${APP_VERSION}" \
             --arg buildVersion "${{ env.BUMPED_VERSION }}" \
             --arg date "$CURRENT_DATE" \
             --arg url "$DOWNLOAD_URL" \
             --arg size "$IPA_SIZE" \
             --arg sha "$IPA_SHA256" \
             '.apps[1].versions = [{"version": $version, "buildVersion": $buildVersion, "date": $date, "localizedDescription": "NuvioPlus experimental build with native C++ libtorrent engine.", "downloadURL": $url, "size": ($size | tonumber), "sha256": $sha}] + (.apps[1].versions // [])' \
             apps.json > tmp.json && mv tmp.json apps.json

      - name: Commit Updated Metadata
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json iosApp/Configuration/Version.xcconfig
          git commit -m "chore(NuvioPlus): bump version and update apps.json for build ${{ env.BUMPED_VERSION }} [skip ci]" || echo "No changes to commit"
          git stash --include-untracked
          git pull --rebase origin "nuvio-cpp"
          git push origin HEAD:"nuvio-cpp"
