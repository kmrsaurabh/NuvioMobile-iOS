name: Build Nuvio Mobile (iOS & Android)

on:
  workflow_dispatch:
  push:
    branches:
      - build-test
      - cmp-rewrite

jobs:
  build-ios-full:
    name: Build iOS Full Version
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository & Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Git Checkout Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Fetch iOS Specific Submodule
        run: git submodule update --init --recursive MPVKit

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Konan (Kotlin Native Toolchain)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle.kts', '**/*.gradle') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_IOS_DISTRIBUTION=full
          EOF
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true
          cache-dependency-path: go-torrent/go.sum

      - name: Cache Xcode and ComposeApp Build Outputs
        uses: actions/cache@v4
        with:
          path: |
            iosApp/build
            composeApp/build
          key: ${{ runner.os }}-xcode-composeapp-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xcode-composeapp-build-

      - name: Cache GoTorrent Framework
        uses: actions/cache@v4
        id: cache-gotorrent
        with:
          path: iosApp/Frameworks/GoTorrent.xcframework
          key: ${{ runner.os }}-gotorrent-${{ hashFiles('go-torrent/**/*.go', 'go-torrent/go.mod', 'go-torrent/go.sum') }}

      - name: Build GoTorrent Framework
        if: steps.cache-gotorrent.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          cd go-torrent
          go mod tidy
          go get golang.org/x/mobile/bind
          gomobile bind -target=ios,iossimulator -o ../iosApp/Frameworks/GoTorrent.xcframework .

      - name: Bump iOS Build Version
        run: |
          cd iosApp/Configuration
          CURRENT_VERSION=$(grep 'CURRENT_PROJECT_VERSION' Version.xcconfig | cut -d'=' -f2)
          NEW_VERSION=$((CURRENT_VERSION + 1))
          sed -i '' "s/CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=${NEW_VERSION}/" Version.xcconfig
          echo "BUMPED_VERSION=${NEW_VERSION}" >> $GITHUB_ENV

      - name: Build iOS App via Xcode
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package App into .ipa
        run: |
          cd iosApp/build/Build/Products/Release-iphoneos
          APP_VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Nuvio.app/Info.plist)
          rm -rf Payload
          mkdir -p Payload
          cp -R Nuvio.app Payload/
          zip -q -r "Nuvio-v${APP_VERSION}-Full.ipa" Payload
          echo "IPA_FILENAME=Nuvio-v${APP_VERSION}-Full.ipa" >> $GITHUB_ENV
      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-iOS-Full
          path: iosApp/build/Build/Products/Release-iphoneos/${{ env.IPA_FILENAME }}

      - name: Commit Updated Build Version
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iosApp/Configuration/Version.xcconfig
          git commit -m "chore: bump iOS build version to ${{ env.BUMPED_VERSION }} [skip ci]"
          git push origin HEAD:${{ github.ref }}

  build-android:
    name: Build Android Full Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Git Checkout Timestamps
        uses: chetan/git-restore-mtime-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate local.properties
        run: |
          cat << 'EOF' > local.properties
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          TRAKT_CLIENT_ID=${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET=${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI=${{ secrets.TRAKT_REDIRECT_URI }}
          TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
          INTRODB_API_URL=${{ secrets.INTRODB_API_URL }}
          CONTRIBUTIONS_URL=${{ secrets.CONTRIBUTIONS_URL }}
          DONATIONS_BASE_URL=${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL=${{ secrets.DONATIONS_DONATE_URL }}
          DIRECT_DEBRID_API_BASE_URL=${{ secrets.DIRECT_DEBRID_API_BASE_URL }}
          NUVIO_ANDROID_DISTRIBUTION=full
          EOF


      - name: Build Full APK
        run: |
          ./gradlew \
            :composeApp:assembleFullDebug \
            -Pnuvio.splitAbi=true \
            --stacktrace
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Android-Full
          path: composeApp/build/outputs/apk/full/debug/*.apk
